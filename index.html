<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小包异常监控 · Parcel Monitor</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="data.js?v=20261028153007"></script>
<style>
:root{--bg:#fff;--bg2:#f6f5f2;--tx:#1a1a1a;--tx2:#6b6a66;--tx3:#9b9a95;--bd:#e5e4df;--red:#a32d2d;--redbg:#fcebeb;--amb:#854f0b;--ambbg:#faeeda;--grn:#0f6e56;--grnbg:#e1f5ee;--blu:#185fa5;--blubg:#e6f1fb}
*{box-sizing:border-box;margin:0}
body{font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;font-size:13px;color:var(--tx);background:var(--bg);line-height:1.6}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px}
h1{font-size:16px;font-weight:500}
.badge{font-size:12px;padding:2px 8px;border-radius:999px;display:inline-block}
.b-blu{background:var(--blubg);color:var(--blu)}.b-gray{background:var(--bg2);color:var(--tx2)}
.b-red{background:var(--redbg);color:var(--red)}.b-amb{background:var(--ambbg);color:var(--amb)}.b-grn{background:var(--grnbg);color:var(--grn)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--bd);margin:14px 0}
.tabs button{border:none;background:none;padding:7px 12px;font-size:13px;color:var(--tx2);cursor:pointer;border-bottom:2px solid transparent}
.tabs button.on{color:var(--tx);font-weight:500;border-bottom-color:var(--tx)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--bg2);border-radius:8px;padding:14px}
.card .k{color:var(--tx2);font-size:13px}.card .v{font-size:24px;font-weight:500;margin-top:2px}
select,input{padding:6px 8px;border:0.5px solid var(--bd);border-radius:6px;background:#fff;font-size:13px;color:var(--tx)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{color:var(--tx2);font-weight:400;text-align:left;padding:8px 6px;border-bottom:1px solid var(--bd)}
td{padding:8px 6px;border-bottom:0.5px solid var(--bd);vertical-align:top}
button.act{border:0.5px solid var(--bd);background:#fff;border-radius:6px;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--tx)}
button.act:hover{background:var(--bg2)}
.fgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:var(--bg2);border-radius:8px;padding:12px;margin-bottom:12px}
.fgrid label{font-size:12px;color:var(--tx3);display:block;margin-bottom:3px}
.fgrid select{width:100%}
  .mselb{display:inline-block;border:0.5px solid var(--bd);border-radius:8px;padding:4px 10px;font-size:12px;cursor:pointer;background:var(--bg);color:var(--tx)}
  .sel{border:0.5px solid var(--bd);border-radius:8px;padding:5px 8px;font-size:12px;background:var(--bg);color:var(--tx)}
.hint{font-size:12px;color:var(--tx3)}
.muted{color:var(--tx2)}
.tl{border-left:2px solid var(--bd);margin-left:6px;padding-left:16px}
.tl .ev{margin-bottom:12px}
.tl .t{font-weight:500}.tl .n{color:var(--tx3);font-weight:400;font-size:12px}
.tl .d{color:var(--tx2)}
.rowdist{display:grid;grid-template-columns:72px 56px minmax(0,1fr) 48px;gap:0 10px;align-items:center;row-gap:10px;margin:10px 0 14px}
.rowdist .bar{height:16px;background:var(--bg2);border-radius:4px;overflow:hidden}
.rowdist .bar>div{height:100%}
#gate{max-width:360px;margin:15vh auto;text-align:center}
#gate input{width:220px;margin:12px 0}
.hidden{display:none}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px}
.dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:middle}
#drill{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:40px 16px;overflow:auto}
#drill .box{background:#fff;border-radius:12px;border:0.5px solid var(--bd);max-width:860px;width:100%;padding:16px 20px}
.rowclick{cursor:pointer}
.rowclick:hover{background:var(--bg2)}
</style>
</head>
<body>
<div id="gate" class="wrap">
  <h1>小包异常监控</h1>
  <p class="muted">内部系统 · 请输入访问口令</p>
  <input id="pw" type="password" placeholder="访问口令" onkeydown="if(event.key==='Enter')tryGate()">
  <br><button class="act" onclick="tryGate()">进入</button>
  <p id="gerr" class="hint" style="color:var(--red);margin-top:8px"></p>
</div>
<div id="app" class="wrap hidden">
  <div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px">
    <h1>小包异常监控看板</h1>
    <div style="display:flex;gap:6px;align-items:center"><span class="badge b-blu" id="scope"></span> <span class="badge b-gray" id="cutoff"></span>
      <input id="lookup" placeholder="查件：输入运单号回车" style="width:200px;border:0.5px solid var(--bd);border-radius:8px;padding:5px 8px;font-size:12px;background:var(--bg);color:var(--tx)" onkeydown="if(event.key==='Enter')lookupWb(this.value)">
    </div>
  </div>
  <div class="tabs">
    <button class="on" data-t="t1" onclick="tab('t1',this)">监控总览</button>
    <button data-t="t2" onclick="tab('t2',this)">异常明细 + 导出</button>
    <button data-t="t3" onclick="tab('t3',this)">运单轨迹</button>
    <button data-t="t4" onclick="tab('t4',this)">阈值标准</button>
    <button data-t="t5" onclick="tab('t5',this)">跟单配置</button>
  </div>
  <div id="t1">
    <div class="cards" id="kpis"></div>
    <p style="font-weight:500;margin-bottom:2px">在途分布（按节点）<span class="hint"> · 各行相加 = 在途总量</span></p>
    <p class="hint">一张单此刻停在哪个节点就计入哪一行；每日随轨迹刷新重算</p>
    <div class="rowdist" id="dist"></div>
    <div class="legend">
      <span><span class="dot" style="background:#378add"></span>蓝 = 正常流转</span>
      <span><span class="dot" style="background:#0f6e56"></span>绿 = 已交末端派送</span>
      <span><span class="dot" style="background:#a32d2d"></span>红 = 异常挂起</span>
    </div>
  </div>
  <div id="t2" class="hidden">
    <div class="fgrid">
      <div><label>第一排 · 归属链</label></div><div></div><div></div><div></div>
      <div><label>物流商</label><select id="f_carrier" onchange="fillChannel();renderEx()"><option value="">全部</option></select></div>
      <div><label>渠道</label><select id="f_channel" onchange="renderEx()"><option value="">全部</option></select></div>
      <div><label>目的国</label><select id="f_dest" onchange="renderEx()"><option value="">全部</option></select></div>
      <div><label>异常类型</label><select id="f_type" onchange="renderEx()"><option value="">全部</option></select></div>
      <div><label>第二排 · 流程与处置</label></div><div></div><div></div><div></div>
      <div><label>分级</label><select id="f_level" onchange="renderEx()"><option value="">全部</option><option>红</option><option>黄</option><option>判丢</option><option>提醒(非异常)</option></select></div>
      <div><label>责任方</label><select id="f_resp" onchange="renderEx()"><option value="">全部</option></select></div>
      <div><label>处置状态</label><select id="f_disp" onchange="renderEx()"><option value="">全部</option><option>待处理</option><option>已认领</option><option>已销案</option></select></div>
      <div><label>触发时间</label><select id="f_time" onchange="renderEx()"><option value="">全部</option><option value="today">今日</option><option value="week">本周</option></select></div>
      <div><label>第三排 · 跟单与定位</label></div><div></div><div></div><div></div>
      <div><label>运单号搜索</label><input id="f_wb" placeholder="输入运单号片段" oninput="renderEx()" style="width:100%;border:0.5px solid var(--bd);border-radius:8px;padding:5px 8px;font-size:12px;background:var(--bg);color:var(--tx)"></div>
      <div><label>来源</label><select id="f_source" onchange="renderEx()"><option value="">全部</option><option>谷仓</option><option>云途直发</option></select></div>
      <div><label>负责人</label><select id="f_owner" onchange="renderEx()"><option value="">全部</option><option value="__un__">未分配</option></select></div>
      <div><label>停留时长</label><select id="f_dwell" onchange="renderEx()"><option value="">全部</option><option value="7">≥7天</option><option value="15">≥15天</option><option value="30">≥30天</option></select></div>
      <div><label>我的身份</label><select id="me_sel" onchange="localStorage.setItem('pm_me',this.value);renderEx();renderKPI()"><option value="">（未选择）</option></select></div>
    </div>
    <div style="overflow-x:auto"><table id="extab"><thead><tr>
      <th>分级</th><th>运单号</th><th>来源</th><th>负责人</th><th>渠道</th><th>目的国</th><th>异常类型</th><th>判定依据</th><th>责任方</th><th>动作</th><th>标记</th>
    </tr></thead><tbody></tbody></table></div>
    <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;align-items:center">
      <span class="badge b-blu" id="excount" style="margin-right:8px"></span><button class="act" onclick="exportExcel('detail')">导出 Excel · 明细模式</button>
      <button class="act" onclick="exportExcel('summary')">导出 Excel · 汇总模式</button>
      <span class="hint" id="fname"></span>
    </div>
  </div>
  <div id="t3" class="hidden">
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:10px">
      <div><label class="hint" style="display:block;font-size:11px">运单号搜索</label><input id="wl_q" class="t5in" style="width:180px" placeholder="片段即可" oninput="WL.page=1;renderWaybillList()"></div>
      <div><label class="hint" style="display:block;font-size:11px">来源</label><select id="wl_source" class="sel" onchange="WL.page=1;renderWaybillList()"><option value="">全部</option><option>谷仓</option><option>云途直发</option></select></div>
      <div><label class="hint" style="display:block;font-size:11px">国家</label><select id="wl_dest" class="sel" onchange="WL.page=1;renderWaybillList()"><option value="">全部</option></select></div>
      <div><label class="hint" style="display:block;font-size:11px">当前站</label><select id="wl_stage" class="sel" onchange="WL.page=1;renderWaybillList()"><option value="">全部</option></select></div>
      <div><label class="hint" style="display:block;font-size:11px">负责人</label><select id="wl_owner" class="sel" onchange="WL.page=1;renderWaybillList()"><option value="">全部</option><option value="__un__">未分配</option></select></div>
    </div>
    <div style="overflow-x:auto"><table id="wltab"><thead><tr>
      <th>运单号</th><th>来源</th><th>国家</th><th>当前站</th><th>状态</th><th>最后事件</th><th>负责人</th><th>轨迹</th>
    </tr></thead><tbody></tbody></table></div>
    <div id="wlpage" style="margin-top:8px"></div>
  </div>
  <div id="wdrawer" onclick="if(event.target===this)this.style.display='none'" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:60">
    <div style="position:absolute;right:0;top:0;bottom:0;width:min(560px,92vw);background:var(--bg);overflow:auto;padding:18px 20px;box-shadow:-8px 0 24px rgba(0,0,0,.18)">
      <div style="display:flex;justify-content:flex-end"><button class="act" onclick="document.getElementById('wdrawer').style.display='none'">关闭 ✕</button></div>
      <div id="wdbody"></div>
    </div>
  </div>
  <div id="t4" class="hidden" id2="t4">
    <div id="t4_body"></div>
  </div>
  <div id="t5" class="hidden">
    <div id="t5_body"></div>
  </div>
</div>
<div id="drill" onclick="if(event.target===this)this.style.display='none'">
  <div class="box">
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px">
      <p style="font-weight:500;font-size:14px;margin:0" id="drill_title"></p>
      <button class="act" onclick="document.getElementById('drill').style.display='none'">关闭</button>
    </div>
    <div style="overflow-x:auto;max-height:60vh;overflow-y:auto"><table id="drill_tab"><thead><tr>
      <th>运单号</th><th>渠道</th><th>目的国</th><th>状态</th><th>最近轨迹</th><th></th>
    </tr></thead><tbody></tbody></table></div>
  </div>
</div>
<script src="app.js?v=20261028153007"></script>
<p class="hint" id="buildinfo" style="margin:10px 6px"></p>
</body>
</html>
